{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA</title>
    <link rel="stylesheet" href="{% static 'chatbot_app/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="chat-container">
    <header class="chat-header">
        <h2>🤖 Asistente Inteligente</h2>
    </header>

    <div id="chat-box" class="chat-messages">
        {% for item in history %}
            <div class="message user">
                <div class="bubble">
                    {{ item.prompt }}
                </div>
            </div>

            <div class="message bot">
                <div class="bubble">
                    {{ item.response }}
                </div>
            </div>
        {% endfor %}
    </div>

    <form method="post" class="input-area">
        {% csrf_token %}
        <textarea name="prompt" placeholder="Escribe tu mensaje aquí..." required rows="1"></textarea>
        <button type="submit">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
            </svg>
        </button>
    </form>
</div>

<script src="{% static 'chatbot_app/chat.js' %}"></script>
<script>
    // Script rápido para que el chat siempre baje al último mensaje
    const chatBox = document.getElementById('chat-box');
    chatBox.scrollTop = chatBox.scrollHeight;
</script>
</body>
</html>
